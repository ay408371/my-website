<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — FinSpark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-body">
  <main class="login-page">
    <a class="brand login-brand" href="index.html" aria-label="Back to FinSpark home">
      <span class="brand-mark">F</span><span>FinSpark</span>
    </a>

    <section class="login-card" aria-labelledby="login-title">
      <div class="login-art" aria-hidden="true">
        <div class="login-blob"></div>
        <div class="coin-stack"><span>₹</span><i></i><i></i><i></i></div>
        <div class="login-character">
          <div class="login-hair"></div>
          <div class="login-face"><i></i><i></i><b></b></div>
          <div class="login-body-shape"><span>✓</span></div>
        </div>
      </div>

      <div class="login-form-wrap">
        <span class="kicker">WELCOME BACK</span>
        <h1 id="login-title">Good to see you again</h1>
        <p class="login-subtitle">Continue planning a brighter financial future.</p>

        <form id="loginForm">
          <label for="email">Email address</label>
          <input id="email" type="email" name="email" placeholder="you@example.com" required />

          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" type="password" name="password" placeholder="Enter your password" minlength="6" required />
            <button type="button" id="togglePassword" aria-label="Show password">Show</button>
          </div>

          <div class="form-options">
            <label class="remember"><input type="checkbox" name="remember" /> <span>Remember me</span></label>
            <a href="#">Forgot password?</a>
          </div>

          <button class="login-submit" type="submit">Log in <span>→</span></button>
          <p class="form-message" id="formMessage" role="status"></p>
        </form>

        <p class="signup-text">New to FinSpark? <a href="#">Create an account</a></p>
      </div>
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>
